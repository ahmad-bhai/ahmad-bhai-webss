<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahmad Bhai all in one</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #8646B4;
            --glass: rgba(255, 255, 255, 0.07);
        }

        /* Sab devices ke liye base settings */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent; /* Mobile touch highlight remove */
        }
        
        body {
            background: #0f0f0f;
            background: radial-gradient(circle at center, #1a1a2e 0%, #080808 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Background Blobs - Desktop par dikhengi, mobile par light rakhi hain */
        .blob {
            position: fixed;
            width: 40vw;
            height: 40vw;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
            animation: move 25s infinite alternate ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-30%, -30%); }
            to { transform: translate(30%, 30%); }
        }

        /* Container: Har device par width adjust karega */
        .container {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 2rem;
            width: 100%;
            max-width: 450px; /* Desktop max limit */
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transition: 0.3s ease;
        }

        h2 { 
            font-size: clamp(1.5rem, 5vw, 2rem); /* Dynamic font size */
            margin-bottom: 0.5rem; 
            background: linear-gradient(to right, #00d2ff, #9d50bb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .tagline { 
            font-size: 0.7rem; 
            opacity: 0.6; 
            margin-bottom: 2rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }

        input {
            width: 100%;
            padding: 1.1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            color: white;
            outline: none;
            font-size: 1rem;
            margin-bottom: 1.2rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 1rem;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: 0.3s active;
        }

        button:active { transform: scale(0.96); }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .container { padding: 1.8rem; border-radius: 1.5rem; }
            h2 { font-size: 1.6rem; }
            input, button { padding: 0.9rem; font-size: 0.95rem; }
        }

        /* Toast: Mobile par center, desktop par bhi center */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150px);
            padding: 14px 28px;
            border-radius: 50px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem;
            z-index: 9999;
            width: max-content;
            max-width: 90%;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #toast.show { transform: translateX(-50%) translateY(0); }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            display: none;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="blob"></div>

<div class="container">
    <h2>Ahmad Bhai Magic</h2>
    <p class="tagline">Cloud Downloader</p>
    
    <input type="text" id="urlInput" placeholder="Paste link here..." spellcheck="false">

    <button id="dlBtn" onclick="startDownload()">
        <span id="btnText">Download Now</span>
        <div class="loader" id="loader"></div>
    </button>
</div>

<div id="toast"></div>

<script>
    function showNotify(msg, color = "#fff") {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.color = color;
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    async function startDownload() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const dlBtn = document.getElementById('dlBtn');
        
        if (!urlInput) {
            showNotify("Url is required", "#ff4757");
            return;
        }

        dlBtn.disabled = true;
        btnText.innerText = "Fetching...";
        loader.style.display = "block";

        const apiBase = "https://ahmad-bhai-social-downloader.vercel.app/api/download/?url=";
        const finalUrl = apiBase + encodeURIComponent(urlInput);

        try {
            const response = await fetch(finalUrl);
            if (!response.ok) throw new Error("File fetch failed");

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            
            let filename = urlInput.split('/').pop().split('?')[0] || 'Ahmad_File';
            if(!filename.includes('.')) filename += ".bin";

            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(downloadUrl);
            
            showNotify("✅ Download Started!", "#2ed573");
        } catch (error) {
            showNotify("❌ Error: Try direct link", "#ff4757");
        } finally {
            dlBtn.disabled = false;
            btnText.innerText = "Download Now";
            loader.style.display = "none";
        }
    }
</script>
</body>
</html>
