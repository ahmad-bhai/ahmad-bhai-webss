<div class="api-card">
    <h3>📸 Web Screenshot Tool</h3>
    <input type="text" id="siteUrl" placeholder="https://example.com" class="input-box">
    <button class="btn" onclick="takeShot()">Capture Now 🚀</button>
    
    <div id="shotResult" style="margin-top: 20px; display: none;">
        <img id="screenshotImg" src="" style="width: 100%; border-radius: 15px; border: 1px solid var(--accent);">
        <br>
        <a id="downloadShot" href="#" download="AhmadBhai_Screenshot.png" class="btn" style="display:inline-block; margin-top:10px;">Download Image</a>
    </div>
</div>

<script>
async function takeShot() {
    const url = document.getElementById('siteUrl').value;
    if(!url) return alert("Bhai, URL to dalo!");
    
    const api = `https://ahmad-bhai-webss.vercel-link.app/api/screenshot?url=${encodeURIComponent(url)}`;
    
    document.getElementById('shotResult').style.display = 'block';
    const img = document.getElementById('screenshotImg');
    img.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJndzR6NHR4M3B6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7bu3XilJ5BOiSGic/giphy.gif"; // Loader

    img.onload = () => {
        document.getElementById('downloadShot').href = api;
    };
    img.src = api;
}
</script>
